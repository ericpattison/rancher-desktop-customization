command:
- "/opt/keycloak/bin/kc.sh"
- "--verbose"
- "start"
- "--http-port=8080"
- "--hostname-strict=false"
- "--spi-events-listener-jboss-logging-success-level=info"
- "--spi-events-listener-jboss-logging-error=warn"

extraEnv: |
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: postgres-cluster-app
        key: username
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-cluster-app
        key: password
  - name: JAVA_OPTS_APPEND
    value: >-
      -XX:MaxRAMPercentage=50.0
      -Djgroups.dns.query={{ include "keycloak.fullname" }}-headless

#dbchecker:
#  enabled: true

database:
  vendor: postgres
  hostname: postgres-cluster-rw
  port: 5432
  username: app
  databse: keycloak
  existingSecret: "postgres-cluster-app"
  existingSecretKey: "password"